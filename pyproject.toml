[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcam-bridge"
version = "0.1.0"
description = "UE Sequencer FBX camera animation -> Disguise AnimateCameraControl keyframe injector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6",
    "requests>=2.28",
    "ufbx==0.0.5",   # default FBX reader (--reader native); pinned, v0.0.x WIP. Blender is the
                     # --reader blender fallback and needs no Python dep (it shells out to Blender).
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vcam = "vcam_bridge.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vcam_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests requiring Blender or live hardware"]
